<div id="fenetreInfo" class="fond-fenetre">

<script>
function ouvrirFenetre() {
  fetch("annonce.html")
    .then(function(response) {
      if (!response.ok) {
        throw new Error("Annonce introuvable");
      }
      return response.text();
    })
    .then(function(html) {
      document.getElementById("texteAnnonce").innerHTML = html;
      document.getElementById("fenetreInfo").style.display = "flex";
    })
    .catch(function(error) {
      console.log("Erreur :", error);
    });
}

function fermerFenetre() {
  document.getElementById("fenetreInfo").style.display = "none";
}

alert("La page 1-accueil est chargée");
window.addEventListener("load", function() {
  document.getElementById("fenetreInfo").style.display = "flex";
});
</script>
